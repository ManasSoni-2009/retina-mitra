# Centralized Hyperparameter & Experiment Configuration for DrishtiSetu

model:
  backbone: "efficientnet_b0"
  num_classes: 5
  pretrained: true

dataset:
  img_size: 384
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

training:
  batch_size: 16
  epochs: 25
  learning_rate: 0.0003
  weight_decay: 0.0001
  seed: 42
  use_class_weights: true
  class_weights: [1.0, 2.5, 1.8, 3.0, 3.5]

decision_thresholds:
  referable_min_grade: 2
  quality_gradable_min: 0.65
  confidence_abstention_min: 0.65

paths:
  checkpoint_dir: "../checkpoints"
  evaluation_dir: "../evaluation/reports"
